name: Live provider contracts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-provider-contracts
  cancel-in-progress: false

jobs:
  live:
    if: vars.SYLLOG_LIVE_PROVIDER_TESTS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYLLOG_LIVE_PROVIDER_TESTS: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SYLLOG_OPENAI_TEST_MODEL: ${{ vars.SYLLOG_OPENAI_TEST_MODEL }}
      SYLLOG_ANTHROPIC_TEST_MODEL: ${{ vars.SYLLOG_ANTHROPIC_TEST_MODEL }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal

      - name: Run isolated live smoke contracts
        run: cargo +1.86.0 test -p syllog-provider-contract-tests --test live_providers -- --ignored --test-threads=1
