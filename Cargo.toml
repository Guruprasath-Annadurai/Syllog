[workspace]
resolver = "2"
members = [
    "crates/syllog-cli",
    "crates/syllog-codegen-wasm",
    "crates/syllog-compiler",
    "crates/syllog-dev-server",
    "crates/syllog-ir",
    "crates/syllog-interpreter",
    "crates/syllog-parser",
    "crates/syllog-project",
    "crates/syllog-proxy",
    "crates/syllog-runtime",
    "crates/syllog-semantic",
    "crates/syllog-spec-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Guruprasath Annadurai"]
repository = "https://github.com/syllog-lang/syllog"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.23"
toml = "0.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wasmtime = { version = "36.0", default-features = false, features = ["cranelift", "runtime"] }
wat = "1.236"
wasm-encoder = "0.236.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
