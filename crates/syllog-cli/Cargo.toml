[package]
name = "syllog-cli"
description = "Command-line interface for Syllog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "syllog"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
syllog-codegen-wasm = { path = "../syllog-codegen-wasm", version = "0.1.0" }
syllog-compiler = { path = "../syllog-compiler", version = "0.1.0" }
syllog-dev-server = { path = "../syllog-dev-server", version = "0.1.0" }
syllog-ir = { path = "../syllog-ir", version = "0.1.0" }
syllog-interpreter = { path = "../syllog-interpreter", version = "0.1.0" }
syllog-parser = { path = "../syllog-parser", version = "0.1.0" }
syllog-package = { path = "../syllog-package", version = "0.1.0" }
syllog-project = { path = "../syllog-project", version = "0.1.0" }
syllog-provider-anthropic = { path = "../syllog-provider-anthropic", version = "0.1.0", optional = true }
syllog-provider-local = { path = "../syllog-provider-local", version = "0.1.0", optional = true }
syllog-provider-openai = { path = "../syllog-provider-openai", version = "0.1.0", optional = true }
syllog-registry-client = { path = "../syllog-registry-client", version = "0.1.0" }
syllog-runtime = { path = "../syllog-runtime", version = "0.1.0" }
syllog-semantic = { path = "../syllog-semantic", version = "0.1.0" }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml_edit.workspace = true

[features]
default = []
provider-anthropic = ["dep:syllog-provider-anthropic"]
provider-local = ["dep:syllog-provider-local"]
provider-openai = ["dep:syllog-provider-openai"]

[dev-dependencies]
wasmtime.workspace = true

[lints]
workspace = true
