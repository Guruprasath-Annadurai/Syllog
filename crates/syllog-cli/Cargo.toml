version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "syllog"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
syllog-codegen-wasm = { path = "../syllog-codegen-wasm", version = "0.1.0" }
syllog-compiler = { path = "../syllog-compiler", version = "0.1.0" }
syllog-ir = { path = "../syllog-ir", version = "0.1.0" }
syllog-parser = { path = "../syllog-parser", version = "0.1.0" }
syllog-project = { path = "../syllog-project", version = "0.1.0" }
syllog-runtime = { path = "../syllog-runtime", version = "0.1.0" }
syllog-semantic = { path = "../syllog-semantic", version = "0.1.0" }
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
